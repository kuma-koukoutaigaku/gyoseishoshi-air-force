<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>行政書士 Air Force</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <div id="game-container">
        <div id="title-screen">
            <h1>行政書士<br>Air Force</h1>
            <p class="subtitle">正しい用語を撃ち抜いて条文を完成させろ！</p>


            <div id="game-type-select" style="margin-bottom: 20px;">
                <button class="type-btn selected" data-type="fill-in">空欄補充シューティング</button>
                <button class="type-btn" data-type="multi-choice">多肢選択シューティング</button>
                <button class="type-btn" data-type="descriptive">記述式（めくり）</button>
            </div>

            <div id="mode-select">
                <button class="mode-btn" data-mode="random">ランダム10問</button>
                <button class="mode-btn selected" data-mode="sequential">順番に出題</button>
            </div>

            <div id="difficulty-select" class="hidden">
                <h3>難易度</h3>
                <div id="difficulty-buttons">
                    <button class="diff-btn selected" data-diff="普通">普通</button>
                    <button class="diff-btn" data-diff="難">難</button>
                    <button class="diff-btn" data-diff="激ムズ">激ムズ</button>
                </div>
            </div>

            <div id="category-select">
                <h3>分野を選択</h3>
                <div id="category-buttons"></div>
            </div>

            <div id="section-select">
                <h3>出題範囲</h3>
                <div id="section-buttons"></div>
            </div>

            <button id="start-btn">ゲームスタート</button>
        </div>

        <div id="game-screen" class="hidden">
            <canvas id="game-canvas"></canvas>
            <div id="question-area">
                <div id="question-text"></div>
            </div>
            <div id="hud">
                <div id="score-display">SCORE: <span id="score">0</span></div>
                <div id="timer-display"><span id="timer">0:00</span></div>
                <div id="life-display">HP: <span id="lives"></span></div>
                <div id="question-num">Q.<span id="q-current">1</span>/<span id="q-total">10</span></div>
                <button id="home-btn">×</button>
            </div>
        </div>

        <div id="result-screen" class="hidden">
            <div id="result-top">
                <h2 id="result-title"></h2>
                <div id="result-top-content">
                    <div id="result-score"></div>
                    <div id="result-ranking" class="hidden"></div>
                </div>
                <div id="result-buttons">
                    <button id="retry-btn">もう一度プレイ</button>
                    <button id="back-btn">タイトルに戻る</button>
                </div>
            </div>
            <div id="result-bottom">
                <div id="result-detail"></div>
            </div>
        </div>
    </div>

    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => {
            regs.forEach(r => r.unregister());
        });
        if ('caches' in window) {
            caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
        }
    }
    </script>
    <script src="questions2.js?v=20260628"></script>
    <script src="kijutsushiki_data.js?v=20260628"></script>
    <script src="loader2.js?v=20260628"></script>
    <script src="game2.js?v=20260628"></script>
</body>
</html>
